<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login or Sign Up | The MoneyGoal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/site.css"></head><body class="mg-page"><header></header><main class="auth-wrap"><section class="auth-card"><h1>Welcome to The MoneyGoal</h1><p class="auth-intro">Create an account or continue your learning journey.</p><div class="auth-tabs"><button class="auth-tab active" data-mode="signup">Sign Up</button><button class="auth-tab" data-mode="login">Login</button></div><form id="signup-form" class="auth-form" novalidate><div class="auth-field"><label for="full-name">Full Name</label><input id="full-name" name="fullName" autocomplete="name"><small class="field-error"></small></div><div class="auth-field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email"><small class="field-error"></small></div><div class="auth-field"><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" inputmode="numeric" autocomplete="tel" maxlength="10"><small class="field-error"></small></div><div class="auth-field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password"><small class="field-error"></small></div><div class="auth-field"><label for="confirm-password">Confirm Password</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password"><small class="field-error"></small></div><div class="auth-status"></div><button class="mg-button auth-submit" type="submit">Create Account</button></form><form id="login-form" class="auth-form" novalidate hidden><div class="auth-field"><label for="identifier">Email or Mobile</label><input id="identifier" name="identifier" autocomplete="username"><small class="field-error"></small></div><div class="auth-field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password"><small class="field-error"></small></div><button id="forgot-password" class="auth-forgot" type="button">Forgot Password?</button><div class="auth-status"></div><button class="mg-button auth-submit" type="submit">Login</button></form></section></main><footer></footer><script src="/assets/config.js"></script><script src="/assets/site.js"></script><script src="/assets/auth.js"></script></body></html>
